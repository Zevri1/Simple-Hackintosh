name: Python CLI tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/python/**"
      - ".github/workflows/python-cli.yml"

concurrency:
  group: python-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile app/python/simple_hackintosh.py
      - name: Run unit tests
        run: python -m unittest discover -s app/python/tests -v
      - name: Verify command help and version
        run: |
          python app/python/simple_hackintosh.py --version
          python app/python/simple_hackintosh.py --help
      - name: Smoke test Windows hardware inventory
        if: runner.os == 'Windows'
        run: python app/python/simple_hackintosh.py hardware --json
      - name: Smoke test CMD launcher
        if: runner.os == 'Windows'
        run: cmd /c app\python\run.bat doctor
      - name: Smoke test PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/python/run.ps1 doctor
      - name: Smoke test macOS inventory and Terminal launcher
        if: runner.os == 'macOS'
        run: |
          chmod +x app/python/run.command
          python app/python/simple_hackintosh.py hardware --json
          SIMPLE_HACKINTOSH_NO_PAUSE=1 app/python/run.command doctor
          test -x app/python/run.command
