name: Build macOS desktop app

on:
  push:
    branches:
      - main
      - feat/macos-desktop-app
    paths:
      - "app/macos/**"
      - ".github/workflows/macos-app.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/macos/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run core tests
        run: swift test --package-path app/macos

      - name: Build macOS app
        run: swift build --package-path app/macos -c release

      - name: Package .app bundle
        run: bash app/macos/scripts/package-app.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Hackintosh-macOS-0.1.0
          path: app/macos/.build/packaged/Simple-Hackintosh-macOS-0.1.0.zip
          if-no-files-found: error
          retention-days: 14
