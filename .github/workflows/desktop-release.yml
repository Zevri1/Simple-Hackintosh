name: Desktop Preview Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        default: "0.2.0"
      publish_release:
        description: "Create a public GitHub Release after successful builds"
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Simple-Hackintosh-Windows
            file: dist/Simple-Hackintosh.exe
          - os: macos-latest
            artifact: Simple-Hackintosh-macOS
            file: dist/Simple-Hackintosh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-app/requirements.txt pyinstaller
      - name: Build standalone executable
        working-directory: desktop-app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Simple-Hackintosh app/main.py
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-app/${{ matrix.file }}
          if-no-files-found: error
      - name: Attach binary to GitHub Release
        if: inputs.publish_release == true || startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ inputs.version || '0.2.0' }}
          name: Simple Hackintosh Desktop v${{ inputs.version || '0.2.0' }} (Preview)
          files: desktop-app/${{ matrix.file }}
          draft: false
          prerelease: true
          generate_release_notes: true
