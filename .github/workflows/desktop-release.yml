name: Desktop Preview Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Simple-Hackintosh-Windows
            exe: dist/Simple-Hackintosh.exe
          - os: macos-latest
            artifact: Simple-Hackintosh-macOS
            exe: dist/Simple-Hackintosh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-app/requirements.txt pyinstaller
      - name: Build executable
        working-directory: desktop-app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Simple-Hackintosh app/main.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-app/${{ matrix.exe }}
          if-no-files-found: error
      - name: Attach executable to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-app/${{ matrix.exe }}
          generate_release_notes: true
