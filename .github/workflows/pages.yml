name: Deploy documentation website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/**"
      - "social-preview.jpg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate website JavaScript and HTML contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check site/tools.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ContractParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.data_attributes = set()
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.append(values["id"])
                  self.data_attributes.update(key for key in values if key.startswith("data-"))

          requirements = {
              "site/index.html": {"main-content", "home-view", "docs-view", "chapter-grid", "doc-article", "search-dialog"},
              "site/tools.html": {"tool-efi", "tool-config", "tool-hardware", "efi-run", "config-run", "hardware-run"},
          }
          for filename, required in requirements.items():
              parser = ContractParser()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
              missing = sorted(required.difference(parser.ids))
              if duplicates or missing:
                  raise SystemExit(f"{filename}: duplicate IDs={duplicates}; missing IDs={missing}")
          print("Website HTML contracts and JavaScript syntax passed.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/docs _site/templates
          cp site/index.html site/styles.css site/app.js site/favicon.svg site/tools.html site/tools.css site/tools.js _site/
          cp docs/*.md _site/docs/
          cp templates/*.md _site/templates/
          cp social-preview.jpg _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
