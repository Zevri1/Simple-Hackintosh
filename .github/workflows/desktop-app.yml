name: Desktop app checks
on:
  push:
    paths: ["desktop-app/**", ".github/workflows/desktop-app.yml"]
  pull_request:
    paths: ["desktop-app/**", ".github/workflows/desktop-app.yml"]
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app tests
      - run: pytest -q
