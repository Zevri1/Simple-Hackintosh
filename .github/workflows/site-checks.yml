name: Website quality checks

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site-checks.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site-checks.yml"

permissions:
  contents: read

jobs:
  static-checks:
    name: Validate site assets and HTML contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/tools.js
      - name: Check HTML contracts, duplicate IDs, and release links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class ContractParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.data_attributes = set()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.append(values["id"])
                  self.data_attributes.update(key for key in values if key.startswith("data-"))
                  if values.get("href"):
                      self.hrefs.append(values["href"])

          contracts = {
              "site/index.html": {
                  "ids": {"main-content", "home-view", "docs-view", "chapter-grid", "doc-article", "search-dialog"},
                  "data": {"data-home-link", "data-guide-link"},
              },
              "site/tools.html": {
                  "ids": {"tool-efi", "tool-config", "tool-hardware", "efi-run", "config-run", "hardware-run"},
                  "data": {"data-tool-target", "data-tool-panel"},
              },
          }
          release_asset = "https://github.com/Zevri1/Simple-Hackintosh/releases/download/v2.5.2/Simple-Hackintosh-CLI-v2.5.2.zip"
          for filename, contract in contracts.items():
              parser = ContractParser()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
              missing_ids = sorted(contract["ids"].difference(parser.ids))
              missing_data = sorted(contract["data"].difference(parser.data_attributes))
              if duplicates or missing_ids or missing_data:
                  raise SystemExit(f"{filename}: duplicates={duplicates}, missing IDs={missing_ids}, missing data attributes={missing_data}")
              if release_asset not in parser.hrefs:
                  raise SystemExit(f"{filename}: the v2.5.2 CLI download link is missing")
          for filename in ("site/styles.css", "site/tools.css"):
              css = Path(filename).read_text(encoding="utf-8")
              if css.count("{") != css.count("}"):
                  raise SystemExit(f"{filename}: unbalanced CSS braces")
          home_ids = set(re.findall(r'getElementById\(["\']([^"\']+)["\']\)', Path("site/app.js").read_text(encoding="utf-8")))
          tools_ids = set(re.findall(r'\$\(["\']([^"\']+)["\']\)', Path("site/tools.js").read_text(encoding="utf-8")))
          for filename, referenced in (("site/index.html", home_ids), ("site/tools.html", tools_ids)):
              parser = ContractParser()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              missing = sorted(referenced.difference(parser.ids))
              if missing:
                  raise SystemExit(f"{filename}: JavaScript references missing DOM IDs: {missing}")
          tool_html = Path("site/tools.html").read_text(encoding="utf-8")
          if 'role="tablist"' not in tool_html or tool_html.count('role="tab"') != 3 or tool_html.count('role="tabpanel"') != 3:
              raise SystemExit("Tools tabs are missing accessible tablist/tab/tabpanel roles.")
          legacy_owner = "kiwewe09" + "-aa"
          owner_link_files = ("README.md", "app/python/README.md", "site/index.html", "site/tools.html", "site/app.js")
          for filename in owner_link_files:
              if legacy_owner in Path(filename).read_text(encoding="utf-8"):
                  raise SystemExit(f"{filename}: stale GitHub owner reference found")
          if "https://zevri1.github.io/Simple-Hackintosh/" not in Path("site/index.html").read_text(encoding="utf-8"):
              raise SystemExit("site/index.html: updated GitHub Pages canonical URL is missing")
          print("Website JavaScript, HTML hooks, release links, and CSS braces passed.")
          PY
